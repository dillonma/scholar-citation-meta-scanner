name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches the plugin version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HDR=$(grep -m1 -E '^[[:space:]]*\*[[:space:]]*Version:' scholar-citation-meta-scanner.php | awk '{print $NF}')
          STABLE=$(grep -m1 -E '^Stable tag:' readme.txt | awk '{print $NF}')
          echo "tag=$TAG header=$HDR stable=$STABLE"
          test "$TAG" = "$HDR" && test "$TAG" = "$STABLE"
      - name: Build plugin zip
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p build/scholar-citation-meta-scanner
          git archive HEAD | tar -x -C build/scholar-citation-meta-scanner
          (cd build && zip -qr ../scholar-citation-meta-scanner-$VER.zip scholar-citation-meta-scanner)
          unzip -l scholar-citation-meta-scanner-$VER.zip
      - name: Attach zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" scholar-citation-meta-scanner-*.zip --clobber
